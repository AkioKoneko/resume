name: Build Resume PDF (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate PDF
        run: npm run generate:pdf

      - name: Upload PDF for review
        uses: actions/upload-artifact@v4
        with:
          name: Aleksandr_Detushev_Resume
          path: output/pdf/Aleksandr_Detushev_Resume.pdf
