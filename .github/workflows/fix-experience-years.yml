name: Fix experience years

on:
  push:
    paths:
      - '.github/workflows/fix-experience-years.yml'

permissions:
  contents: write

jobs:
  fix-years:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct experience years
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ("index.html", "README.md"):
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              text = text.replace("8+ years", "7+ years")
              text = text.replace("eight years", "over seven years")
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html README.md; then
            echo "Nothing to update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          git commit -m "Correct experience to 7+ years"
          git push
